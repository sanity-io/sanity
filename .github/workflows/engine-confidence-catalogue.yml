name: Engine confidence catalogue
permissions: {}

# The Engine confidence bug catalogue applies patches to engine sources. When
# engine code moves, a patch can stop applying and the weekly score silently
# loses an entry. This cheap check runs `git apply --check` on every patch
# whenever the engine or the catalogue changes. It is not a required check.
on:
  pull_request:
    paths:
      - "engine-confidence/catalogue/**"
      - "packages/@sanity/mutator/src/**"
      - "packages/sanity/src/core/store/document/**"
      - "packages/sanity/src/core/form/**"
      - "packages/sanity/src/structure/panes/document/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  apply-check:
    name: Catalogue patches apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that every patch applies
        run: |
          FAILED=0
          for PATCH in engine-confidence/catalogue/*.patch engine-confidence/catalogue/witness/*.patch; do
            if [ ! -f "$PATCH" ]; then continue; fi
            if ! git apply --check "$PATCH"; then
              echo "::error file=$PATCH::Patch no longer applies. See the refresh section in engine-confidence/README.md."
              FAILED=1
            fi
          done
          exit "$FAILED"
