name: Bundle Stats
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-stats:
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
      # Held on v1: v2 bundles with Rolldown, which cannot bundle CSS and does not
      # externalize it, so every scenario that reaches `sanity/bundle.css` fails.
      # See the renovate.json rule that blocks v2 for the upgrade conditions.
      - uses: rexxars/bundle-stats@d3671d09a4973b4b2b09c4fe8b1c07c360683397 # v1
        with:
          packages: packages/sanity
          build-command: pnpm build
          only: "."
          compare-npm: latest
