name: Bundle Stats
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-stats:
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/detect-code-changes
        id: changes

      - uses: ./.github/actions/setup
        if: steps.changes.outputs.has_changes == 'true'
      # bundle-stats checks out the base commit with its errors silenced, and git refuses
      # that checkout when the install has modified a tracked file (pnpm-workspace.yaml)
      # that differs between the base and the pull request.
      - name: Discard install-time changes to tracked files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git diff --stat
          git checkout -- .
      # Held on v1: v2 bundles with Rolldown, which cannot bundle CSS and does not
      # externalize it, so every scenario that reaches `sanity/bundle.css` fails.
      # See the renovate.json rule that blocks v2 for the upgrade conditions.
      - uses: rexxars/bundle-stats@d3671d09a4973b4b2b09c4fe8b1c07c360683397 # v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          packages: packages/sanity
          # The action switches from the baseline to the head commit after building; a build
          # that rewrites tracked files (such as the lockfile) would block that checkout.
          build-command: pnpm build && git checkout -- .
          only: "."
          compare-npm: latest
