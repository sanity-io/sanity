name: Engine confidence
permissions: {}

# Weekly Engine confidence scores: how well the tests guard the document
# engine (mutator, document store, form patching, Portable Text sync). Both
# are Stryker's mutation score alone: the total over the two mutation runs and
# the core Studio score over the sanity run. The known-bug catalogue is stored
# in the same engineConfidenceRun document as supporting detail and never
# feeds either score, so a catalogue failure still stores the scores. The
# document lands in the Studio Radar dataset and shows on the Radar "Engine
# confidence" tab.
#
# Thursdays on main only, never pull_request: the store job holds the dataset
# write token, which must never run PR-authored code (same stance as
# sync-git-metrics.yml and bench.yml). The measuring jobs hold no write token.
# A failed run is safe to re-run: the stored document id is the ISO week, so a
# re-run replaces that week's document.
#
# Stryker results are incremental: each run reuses the previous successful
# run's results, and every fourth ISO week (or when dispatched with `full`)
# runs from scratch so a stale verdict cannot persist.
#
# The sync verification jobs run alongside the score and never block it: the
# sync generator runs new seeds every ISO week, sync-verify replays each
# failure against a fresh staging dataset, and sync-file files new
# signatures in Linear. A manual dispatch files nothing unless `sync_dry_run`
# is turned off.
on:
  schedule:
    # Thursday 03:00 UTC
    - cron: "0 3 * * 4"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore the previous incremental Stryker results and mutate everything"
        required: false
        type: boolean
        default: false
      store:
        description: "Write the result to the Radar dataset"
        required: false
        type: boolean
        default: true
      sync_dry_run:
        description: "Print the sync verification issues instead of filing them in Linear"
        required: false
        type: boolean
        default: true

concurrency:
  group: engine-confidence
  cancel-in-progress: false

jobs:
  plan:
    # A dispatch from another branch does nothing: the series is main's
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      started-at: ${{ steps.plan.outputs.started-at }}
      previous-run-id: ${{ steps.plan.outputs.previous-run-id }}
      full: ${{ steps.plan.outputs.full }}
      sync-seed-base: ${{ steps.plan.outputs.sync-seed-base }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PREVIOUS_RUN_ID=$(gh run list --workflow engine-confidence.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          # Base 10 so a week like 08 does not parse as octal
          WEEK=$((10#$(date -u +%V)))
          FULL=false
          if [ "$INPUT_FULL" = "true" ] || [ -z "$PREVIOUS_RUN_ID" ] || [ $((WEEK % 4)) -eq 0 ]; then
            FULL=true
          fi
          # New sync generator seeds every ISO week, e.g. 202644NN for 2026-W44
          SYNC_SEED_BASE=$(( $(date -u +%G) * 10000 + WEEK * 100 ))
          {
            echo "started-at=$STARTED_AT"
            echo "previous-run-id=$PREVIOUS_RUN_ID"
            echo "full=$FULL"
            echo "sync-seed-base=$SYNC_SEED_BASE"
          } >> "$GITHUB_OUTPUT"

  stryker:
    name: Stryker (${{ matrix.target }})
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        target: [sanity, mutator]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Build packages
        run: pnpm build --output-logs=errors-only

      # Without run-id and github-token this would look in the current run
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.full != 'true' && needs.plan.outputs.previous-run-id != ''
        continue-on-error: true
        with:
          name: engine-confidence-stryker-${{ matrix.target }}
          run-id: ${{ needs.plan.outputs.previous-run-id }}
          github-token: ${{ github.token }}
          path: engine-confidence/reports/previous/${{ matrix.target }}

      - name: Run Stryker
        env:
          TARGET: ${{ matrix.target }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          ARGS=()
          if [ "$FULL" = "true" ]; then ARGS+=(--full); fi
          pnpm engine-confidence stryker --target "$TARGET" --previous-dir "reports/previous/$TARGET" "${ARGS[@]}"

      # Success only: a failed run must not become the next incremental base
      - uses: actions/upload-artifact@v7
        with:
          name: engine-confidence-stryker-${{ matrix.target }}
          path: engine-confidence/reports/stryker/${{ matrix.target }}.*
          retention-days: 90

  catalogue:
    needs: [plan]
    runs-on: ubuntu-8core
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # The catalogue runs the fuzz suites, which need more heap than Node's default
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Build packages
        run: pnpm build --output-logs=errors-only

      - name: Run the bug catalogue
        run: pnpm engine-confidence catalogue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-confidence-catalogue
          path: engine-confidence/reports/catalogue/
          retention-days: 30

  score:
    needs: [plan, stryker, catalogue]
    # The catalogue is supporting detail, so its failure must not block the score
    if: ${{ !cancelled() && needs.stryker.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: engine-confidence-stryker-*
          merge-multiple: true
          path: engine-confidence/reports/stryker

      - uses: actions/download-artifact@v8
        if: needs.catalogue.result == 'success'
        with:
          name: engine-confidence-catalogue
          path: engine-confidence/reports/catalogue

      - name: Score
        env:
          STARTED_AT: ${{ needs.plan.outputs.started-at }}
        run: pnpm engine-confidence score --started-at "$STARTED_AT"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-confidence-run
          path: engine-confidence/reports/engine-confidence-run.json
          retention-days: 90

  store:
    needs: [score]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: engine-confidence-run
          path: engine-confidence/reports

      - name: Store the run in the Radar dataset
        env:
          RADAR_SANITY_WRITE_TOKEN: ${{ secrets.RADAR_SANITY_WRITE_TOKEN }}
        run: pnpm engine-confidence store reports/engine-confidence-run.json

  sync-generate:
    name: Sync generator (${{ matrix.seam }} ${{ matrix.shard }})
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    strategy:
      fail-fast: false
      # The operations seam's memoize caches grow about 0.5 MB per sequence and
      # a process stops at 5,000 sequences, which collect-mode reruns and
      # shrinking count toward, so each operations shard runs one seed. `sample`
      # is passing sequences kept per seed for the fake fidelity check: 38 in
      # all, about 300 requests, which keeps sync-verify to a few minutes of
      # staging traffic (see the README).
      matrix:
        include:
          - {seam: pair, shard: 0, first-seed: 0, last-seed: 9, runs: 2500, sample: 2}
          - {seam: operations, shard: 0, first-seed: 10, last-seed: 10, runs: 1500, sample: 3}
          - {seam: operations, shard: 1, first-seed: 11, last-seed: 11, runs: 1500, sample: 3}
          - {seam: operations, shard: 2, first-seed: 12, last-seed: 12, runs: 1500, sample: 3}
          - {seam: operations, shard: 3, first-seed: 13, last-seed: 13, runs: 1500, sample: 3}
          - {seam: operations, shard: 4, first-seed: 14, last-seed: 14, runs: 1500, sample: 3}
          - {seam: operations, shard: 5, first-seed: 15, last-seed: 15, runs: 1500, sample: 3}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Build packages
        run: pnpm build --output-logs=errors-only

      - name: Run the sync generator
        env:
          SEED_BASE: ${{ needs.plan.outputs.sync-seed-base }}
          FIRST_SEED: ${{ matrix.first-seed }}
          LAST_SEED: ${{ matrix.last-seed }}
          SYNC_GEN_COLLECT: "1"
          SYNC_GEN_SEAM: ${{ matrix.seam }}
          SYNC_GEN_RUNS: ${{ matrix.runs }}
          SYNC_GEN_SAMPLE: ${{ matrix.sample }}
          SYNC_GEN_MAX_STEPS: "8"
          SYNC_GEN_COMMIT: ${{ github.sha }}
          SYNC_GEN_REPORT: ${{ github.workspace }}/engine-confidence/reports/sync-verification/report-${{ matrix.seam }}-${{ matrix.shard }}.json
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p "$(dirname "$SYNC_GEN_REPORT")"
          export SYNC_GEN_SEEDS="$((SEED_BASE + FIRST_SEED))-$((SEED_BASE + LAST_SEED))"
          echo "Seeds $SYNC_GEN_SEEDS"
          # The test fails when it collects a failure, so the report decides the step
          pnpm vitest run --project=sanity packages/sanity/src/core/store/document/sync/generated.sync.test.ts || true
          test -s "$SYNC_GEN_REPORT"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-confidence-sync-report-${{ matrix.seam }}-${{ matrix.shard }}
          path: engine-confidence/reports/sync-verification/report-${{ matrix.seam }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  sync-verify:
    needs: [sync-generate]
    # Holds the staging write token: main only, never pull_request. Verifies
    # whichever shards produced a report.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: engine-confidence-sync-report-*
          merge-multiple: true
          path: engine-confidence/reports/sync-verification

      - name: Replay the failures against a real Content Lake
        env:
          SANITY_E2E_PROJECT_ID: ${{ vars.SANITY_E2E_PROJECT_ID_STAGING }}
          SANITY_E2E_SESSION_TOKEN: ${{ secrets.SANITY_E2E_WRITE_TOKEN }}
          SANITY_CLI_API_RATE_LIMIT_BYPASS: ${{ secrets.SANITY_CLI_API_RATE_LIMIT_BYPASS }}
          DATASET_PREFIX: cursor_ci_sync_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          shopt -s nullglob
          REPORTS=("$PWD"/engine-confidence/reports/sync-verification/report-*.json)
          if [ ${#REPORTS[@]} -eq 0 ]; then
            echo "No generator reports to verify"
            exit 1
          fi
          # One at a time to stay under the staging rate limits. A failed dataset
          # delete still writes the verdicts, so keep going and fail at the end.
          STATUS=0
          for INDEX in "${!REPORTS[@]}"; do
            REPORT="${REPORTS[$INDEX]}"
            pnpm engine-confidence sync-verify "$REPORT" --dataset "${DATASET_PREFIX}_${INDEX}" --out "${REPORT%/*}/verdicts-${REPORT##*/report-}" || STATUS=1
          done
          exit $STATUS

      # pnpm runs the script in its own process group, so a cancelled run may never
      # reach the script's signal handler: delete the datasets by their fixed names
      - name: Delete the replay datasets
        if: always()
        env:
          SANITY_E2E_PROJECT_ID: ${{ vars.SANITY_E2E_PROJECT_ID_STAGING }}
          SANITY_E2E_SESSION_TOKEN: ${{ secrets.SANITY_E2E_WRITE_TOKEN }}
          SANITY_CLI_API_RATE_LIMIT_BYPASS: ${{ secrets.SANITY_CLI_API_RATE_LIMIT_BYPASS }}
          DATASET_PREFIX: cursor_ci_sync_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          shopt -s nullglob
          REPORTS=("$PWD"/engine-confidence/reports/sync-verification/report-*.json)
          for INDEX in "${!REPORTS[@]}"; do
            HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "https://${SANITY_E2E_PROJECT_ID}.api.sanity.work/v2025-02-19/datasets/${DATASET_PREFIX}_${INDEX}?tag=sync-verify" \
              -H "Authorization: Bearer ${SANITY_E2E_SESSION_TOKEN}" \
              ${SANITY_CLI_API_RATE_LIMIT_BYPASS:+-H "x-sanity-ratelimit-bypass: ${SANITY_CLI_API_RATE_LIMIT_BYPASS}"})
            case "$HTTP_STATUS" in
              2??|404) ;;
              *) echo "::warning::Could not delete ${DATASET_PREFIX}_${INDEX}: HTTP $HTTP_STATUS" ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-confidence-sync-verdicts
          path: engine-confidence/reports/sync-verification/verdicts-*.json
          if-no-files-found: error
          retention-days: 90

  sync-file:
    needs: [sync-verify]
    # Holds the Linear and Claude keys: main only, never pull_request. Runs
    # after a failed sync-verify too: a leaked dataset still leaves verdicts.
    if: >-
      !cancelled() &&
      (needs.sync-verify.result == 'success' || needs.sync-verify.result == 'failure') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: engine-confidence-sync-*
          merge-multiple: true
          path: engine-confidence/reports/sync-verification

      - name: File new failures in Linear
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SYNC_DRY_RUN: ${{ inputs.sync_dry_run }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SYNC_VERIFICATION_CLAUDE_API_KEY: ${{ secrets.SYNC_VERIFICATION_CLAUDE_API_KEY }}
        run: |
          ARGS=()
          for REPORT in "$PWD"/engine-confidence/reports/sync-verification/report-*.json; do
            ARGS+=("$REPORT" "${REPORT%/*}/verdicts-${REPORT##*/report-}")
          done
          # Scheduled runs file for real; a dispatch files only with sync_dry_run off
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_SYNC_DRY_RUN" != "false" ]; then
            ARGS+=(--dry-run)
          fi
          set +e
          pnpm engine-confidence sync-file "${ARGS[@]}"
          STATUS=$?
          set -e
          if [ -f engine-confidence/reports/sync-verification/sync-file-summary.md ]; then
            cat engine-confidence/reports/sync-verification/sync-file-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-confidence-sync-file-summary
          path: engine-confidence/reports/sync-verification/sync-file-summary.*
          retention-days: 90

  # Nobody watches this workflow's runs, so alert the CI channel instead (same
  # pattern as sync-git-metrics.yml). `cancelled` included because job
  # timeouts conclude as cancelled, not failure.
  alert-failure:
    needs: [plan, stryker, catalogue, score, store, sync-generate, sync-verify, sync-file]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_CI_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":alert-dot: \"${{ github.workflow }}\" (${{ github.event_name }}) failed - check which job failed (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>)"
            }
