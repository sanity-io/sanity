name: Release @next

on:
  schedule:
    # 08:00 and 15:00 CET (GitHub cron is UTC-only; during CEST/summer these fire at 09:00/16:00 local time)
    - cron: "0 7,14 * * *"
  # Manual trigger for an on-demand next release between scheduled runs. Publishing is still
  # skipped if the current HEAD of main has already been published.
  workflow_dispatch:
  # Adding the `trigger: next-release` label to the release PR (ci/release-main) also starts an
  # on-demand run. The release PR is used as the trigger surface because it always exists and
  # always reflects the current state of main — main itself has no PR to label. The label is
  # removed again by the check job, so it works as a repeatable button.
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read # for checkout

concurrency:
  group: release_next
  cancel-in-progress: false

jobs:
  check:
    # scheduled runs always use the default branch, but workflow_dispatch can be pointed at any
    # ref — never publish next releases from anything but main. Label events only count when the
    # trigger label lands on the release PR.
    if: >
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'trigger: next-release' &&
       github.event.pull_request.head.ref == 'ci/release-main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to remove the trigger label after a label-triggered run
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # explicit ref so label-triggered runs check main rather than the PR merge ref (whose
          # head commit is the release commit itself and would always hit the skip below)
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Check for unpublished changes
        id: decide
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # A release commit has nothing new to cut. Checking the commit subject covers the
          # window where the release PR has merged but the release workflow hasn't pushed the
          # vX.Y.Z tag yet…
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == "chore(release): publish"* ]]; then
            echo "Skipping: HEAD is the release commit ($subject)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # …and HEAD sitting exactly on the latest release tag covers it once the tag exists.
          # `--match "v*"` must stay in sync with readGitInfo() in
          # packages/@repo/release-notes/src/commands/bump.ts
          described=$(git describe --tags --long --first-parent --match "v*")
          if [[ "$described" =~ -0-g[0-9a-f]+$ ]]; then
            echo "Skipping: HEAD ($described) is the release commit"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(pnpm --silent release-notes bump --preid=next --suffix-type=commits-ahead --dry-run)
          if [ -z "$version" ]; then
            echo "Failed to compute the next version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Ask the registry whether this exact version already exists — the packages are
          # versioned in lockstep, so checking `sanity` answers for all of them. Published
          # versions are stored without the +hash build metadata, so strip it before the
          # lookup. Anything other than 200/404 (registry outage etc.) fails the job rather
          # than skipping silently.
          http_status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/sanity/${version%%+*}")
          if [ "$http_status" = "200" ]; then
            echo "Skipping: sanity@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$http_status" = "404" ]; then
            echo "Will publish sanity@$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to check the npm registry for sanity@$version (HTTP $http_status)"
            exit 1
          fi

      - name: Remove trigger label
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_LABEL: "trigger: next-release"
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$TRIGGER_LABEL"

  release-next:
    needs: [check]
    if: needs.check.outputs.publish == 'true'
    permissions:
      id-token: write # to enable use of OIDC for npm provenance
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      EXPECTED_NPM_USER: sanity-svc.npm
    steps:
      # Publish packages to npm under the `next` tag. Pin the checkout to the commit the check
      # job validated, in case main has moved since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Bump next versions
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          version=$(pnpm --silent release-notes bump --preid=next --suffix-type=commits-ahead)
          echo "Bumped to $version"
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version mismatch: check job computed $EXPECTED_VERSION but bump produced $version"
            exit 1
          fi

      - name: Build
        run: pnpm build --output-logs=full --log-order=grouped

      - name: Set publishing config
        run: pnpm config set '//registry.npmjs.org/:_authToken' "${NPM_PUBLISH_TOKEN}"
        env:
          NPM_PUBLISH_TOKEN: ${{secrets.NPM_PUBLISH_TOKEN}}

      - name: Check valid token
        run: |
          WHOAMI_RESULT=$(pnpm --silent whoami)
          echo "pnpm whoami result: $WHOAMI_RESULT"
          if [ "$WHOAMI_RESULT" != "$EXPECTED_NPM_USER" ]; then
            echo "Error: pnpm whoami returned '$WHOAMI_RESULT', expected '$EXPECTED_NPM_USER'"
            exit 1
          fi
          echo "✅ npm authentication validated - using $EXPECTED_NPM_USER account"

      - name: Publish packages to npm
        run: pnpm -r publish --tag next --no-git-checks --provenance

      - name: Build bundles for staging
        env:
          SANITY_INTERNAL_ENV: "staging" # sets the __SANITY_STAGING__ global variable to true in built bundles
        run: pnpm run build:bundle

      - name: Upload bundles to staging bucket
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GCS_STAGING_PROJECT_ID }}
          GCLOUD_SERVICE_KEY: ${{ secrets.GCS_STAGING_SERVICE_KEY }}
          GCLOUD_BUCKET: ${{ secrets.GCS_STAGING_BUCKET }}
        run: pnpm bundle-manager publish --tag=next

      - name: Build bundles for production
        run: pnpm run build:bundle

      - name: Upload bundles to production bucket
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GCS_PRODUCTION_PROJECT_ID }}
          GCLOUD_SERVICE_KEY: ${{ secrets.GCS_PRODUCTION_SERVICE_KEY }}
          GCLOUD_BUCKET: ${{ secrets.GCS_PRODUCTION_BUCKET }}
        run: pnpm bundle-manager publish --tag=next

  notify-on-failure:
    needs: [check, release-next]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_CI_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":alert-dot: The workflow \"${{github.workflow}}\" on <${{ github.server_url }}/${{ github.repository }}|${{github.repository}}> failed in branch <${{ github.server_url }}/${{ github.repository }}/tree/${{github.ref_name}}|${{github.ref_name}}> (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run >)"
            }
