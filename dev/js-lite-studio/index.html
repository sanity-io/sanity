<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <title>Sanity Studio (JS-lite)</title>
    <!-- The document globals of the Rust studio's shell, which copies the JS studio's DefaultDocument -->
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-Italic.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-Medium.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: italic;
        font-weight: 500;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-MediumItalic.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-SemiBold.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: italic;
        font-weight: 600;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-SemiBoldItalic.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-Bold.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-BoldItalic.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-ExtraBold.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: italic;
        font-weight: 800;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-ExtraBoldItalic.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-Black.woff2') format('woff2');
      }
      @font-face {
        font-family: Inter;
        font-style: italic;
        font-weight: 900;
        font-display: swap;
        src: url('https://studio-static.sanity.io/Inter-BlackItalic.woff2') format('woff2');
      }
      html {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #13141b;
        }
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
