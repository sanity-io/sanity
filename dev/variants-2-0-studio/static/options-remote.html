<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design options remote</title>
<style>
  :root { --bg:#f3f4f7; --panel:#fff; --fg:#161a22; --muted:#5b6474; --line:#d9dde5; --accent:#4a54e8; --accent-bg:#e8e9fd; --ok:#17825a; --warn:#a96300; --focus:#4a54e8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1218; --panel:#161a22; --fg:#e9ecf2; --muted:#97a0b0; --line:#2a303c; --accent:#8d95ff; --accent-bg:#23274a; --ok:#4fd29a; --warn:#e5a54b; --focus:#8d95ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; }
  h1 { font-size:14px; margin:0 0 4px; display:flex; gap:8px; align-items:center; font-weight:650; }
  .pill { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); } .pill.on { color:var(--ok); border-color:var(--ok); } .pill.off { color:var(--warn); border-color:var(--warn); }
  #state { color:var(--muted); font-size:12px; word-break:break-all; }
  main { padding:12px 14px 40px; display:grid; gap:14px; }
  .cap { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:650; margin-bottom:4px; display:block; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); } button.on { background:var(--accent-bg); border-color:var(--accent); } button:disabled { opacity:.45; cursor:default; }
  button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .comp { display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px 10px; }
  .comp b { font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Design options remote <span class="pill off" id="conn">Not connected</span></h1>
  <div id="state">No studio window found. Open the studio in another window of this browser.</div>
</header>
<main id="main"><div class="row"><button id="openJourneys">Journeys remote ↗</button></div></main>
<script type="module">
import {connect, statusLine} from '/static/remote-core.js'
const $ = (id) => document.getElementById(id)
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
const core = connect(() => render())
const send = (m) => core.send(m)
let status = null
const LETTERS = 'ABCDEFGH'
function render() {
  status = core.target()
  const on = !!status
  $('conn').textContent = on ? 'Connected' : 'Not connected'; $('conn').className = 'pill ' + (on ? 'on' : 'off')
  $('state').textContent = statusLine(core)
  Object.assign($('state').dataset, {preset: status?.preset ?? '', stage: status?.stage ?? '', path: status?.path ?? ''})
  const main = $('main'); main.replaceChildren()
  const top = el('div', 'row'); const oj = el('button', null, 'Journeys remote ↗'); oj.id = 'openJourneys'; top.append(oj); main.append(top)
  oj.addEventListener('click', () => window.open('/static/remote.html', 'variants-2-0-remote', 'popup,width=1200,height=800'))
  const o = status?.options
  if (!o) return
  const group = (title, ...nodes) => { const d = el('div'); d.append(el('span', 'cap', title)); const r = el('div', 'row'); r.append(...nodes); d.append(r); main.append(d) }
  const btn = (text, active, onClick, attrs = {}) => { const b = el('button', active ? 'on' : '', text); Object.assign(b.dataset, attrs); b.addEventListener('click', onClick); return b }
  group('Show', btn('Stock', o.global === 'stock', () => send({type: 'global', choice: 'stock'}), {show: 'stock'}),
    ...[0, 1, 2].map((i) => btn(LETTERS[i], o.global === i, () => send({type: 'global', choice: i}), {show: LETTERS[i]})),
    btn('Final', o.global === 'final', () => send({type: 'global', choice: 'final'}), {show: 'final'}))
  group('Shape', ...[['round', 'Round'], ['box', 'Box']].map(([id, label]) => btn(label, o.shape === id, () => send({type: 'shape', shape: id}), {shape: id})))
  group('Stage', ...o.stages.map((s) => btn(s.label, status.stage === s.id, () => send({type: 'stage', stage: s.id}), {stage: s.id})))
  if (status.stage === 'ga') group('Dimensions', ...o.dimensions.map((d) => btn(d.label, o.dimensionLimit === d.value, () => send({type: 'dimensions', limit: d.value}), {dim: String(d.value)})))
  group('Preset', ...o.presets.map((p) => btn(p.name, status.preset === p.id, () => send({type: 'preset', preset: p.id}), {preset: p.id})))
  const comps = el('div'); comps.style.display = 'grid'; comps.style.gap = '6px'; comps.append(el('span', 'cap', 'Option slots'))
  for (const c of o.components) {
    const row = el('div', 'comp'); row.dataset.component = c.id
    row.append(el('b', null, c.title))
    const r = el('div', 'row')
    c.options.forEach((opt, i) => { const b = btn(LETTERS[i], c.chosen === opt.id, () => send({type: 'option', component: c.id, option: opt.id}), {option: opt.id}); b.title = opt.label; b.disabled = opt.label === 'Not drawn'; r.append(b) })
    row.append(r); comps.append(row)
  }
  main.append(comps)
  const tail = el('div', 'row'); tail.append(btn('Reset slots', false, () => send({type: 'reset'})), btn('Reset all', false, () => send({type: 'reset', all: true}))); main.append(tail)
}
render()
</script>
</body>
</html>
