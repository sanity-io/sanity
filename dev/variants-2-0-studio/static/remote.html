<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journeys remote</title>
<style>
  /* The look follows the designer's Studio Flows file (exemplar frame 419:2): cards keep their fills in both themes. */
  :root {
    --page:#f1f2f5; --panel:#ffffff; --fg:#14181f; --muted:#5a6270; --line:#d6dae2; --accent:#4a54e8; --accent-bg:#e8e9fd; --ok:#0a8f3c; --warn:#b87000; --focus:#4a54e8;
    --de:#e9ebf0; --rule:#9aa1ad; --quote:#1b6fd1; --pain-label:#9a6a00;
    --c-trigger:#b9b9b9; --c-step:#ededed; --c-success:#3fea00; --c-failure:#fff500; --c-text:#0b0b0b; --pain-text:#2a2f38; --pain-card:#fff8d6;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --page:#4b4b4b; --panel:#2f2f2f; --fg:#ededed; --muted:#b9b9b9; --line:#5a5a5a; --accent:#8d95ff; --accent-bg:#3a3d6b; --ok:#3fea00; --warn:#fff500; --focus:#8d95ff;
    --de:#353535; --rule:#797979; --quote:#55beff; --pain-label:#fff500; --pain-text:#ededed; --pain-card:transparent;
  } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--page); color:var(--fg); font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; display:grid; grid-template-columns:340px 1fr; grid-template-rows:auto 1fr auto; grid-template-areas:"top top" "list main" "list dock"; }
  header { grid-area:top; display:flex; gap:12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; font-weight:650; }
  .pill { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .pill.on { color:var(--ok); border-color:var(--ok); } .pill.off { color:var(--warn); border-color:var(--warn); }
  #state { color:var(--muted); font-size:12px; word-break:break-all; flex:1; min-width:200px; }
  aside { grid-area:list; border-right:1px solid var(--line); overflow:auto; background:var(--panel); padding:6px 8px 20px; }
  .task { padding:10px 6px 4px; } .task h2 { font-size:12px; margin:0; font-weight:700; } .task p { margin:2px 0 0; font-size:11px; color:var(--muted); }
  .task details { margin-top:4px; font-size:11px; color:var(--muted); } .task summary { cursor:pointer; }
  .jr { display:grid; grid-template-columns:12px 1fr; gap:2px 8px; width:100%; text-align:left; border:0; background:none; padding:7px 6px; border-radius:6px; cursor:pointer; color:var(--fg); font:inherit; align-items:start; }
  .jr:hover { background:var(--de); } .jr.cur { background:var(--accent-bg); }
  .jr .tt { font-weight:550; } .jr .meta { grid-column:2; display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:11px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; margin-top:5px; background:var(--muted); }
  .dot.none { background:transparent; border:1px dashed var(--muted); }
  .chip { font-size:10px; padding:0 7px; border-radius:99px; background:#2a2a2a22; color:var(--fg); white-space:nowrap; border:1px solid var(--line); }
  .scope { font-size:10px; padding:0 7px; border-radius:3px; color:#fff; white-space:nowrap; font-weight:600; }
  main { grid-area:main; overflow:auto; padding:16px 20px; min-height:0; }
  .cap { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:650; }
  .tl { font-size:18px; font-weight:700; margin:0; } .tintro { color:var(--muted); font-size:12px; max-width:760px; margin:2px 0 8px; }
  .tag { font-size:10px; background:#3fea00; color:#0b0b0b; padding:1px 7px; border-radius:2px; font-weight:600; margin-left:8px; vertical-align:middle; }
  .de { background:var(--de); border-radius:3px; padding:10px 12px; margin:8px 0 14px; max-width:820px; }
  .de .x { font-size:13px; margin-top:4px; }
  .headline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 2px; } .headline h3 { font-size:15px; font-weight:650; margin:0; }
  .headline .dot { margin:0; width:10px; height:10px; }
  .note { color:var(--muted); font-size:11px; margin:2px 0 10px; } .note a { color:var(--accent); }
  .track { display:flex; overflow-x:auto; padding:6px 0 18px; align-items:flex-start; }
  .col { display:flex; flex-direction:column; flex:none; padding-right:24px; }
  .phase { border-top:2px solid var(--rule); padding-top:6px; margin-bottom:10px; min-height:20px; }
  .phase b { display:block; font-size:12px; } .phase span { color:var(--muted); font-size:11px; display:block; max-width:360px; }
  .cards { display:flex; gap:24px; align-items:flex-start; }
  .unit { width:210px; flex:none; display:flex; flex-direction:column; gap:10px; position:relative; }
  .unit:not(:last-child)::after { content:"→"; position:absolute; right:-18px; top:50px; color:var(--muted); font-size:13px; }
  .card { border-radius:3px; padding:10px 10px 8px; background:var(--c-step); color:var(--c-text); min-height:132px; position:relative; scroll-margin:24px; transition:opacity .15s, box-shadow .15s; display:flex; flex-direction:column; gap:6px; }
  .card.trigger { background:var(--c-trigger); } .card.success { background:var(--c-success); } .card.failure { background:var(--c-failure); }
  .card.idea { outline:1.5px dashed #6a6a6a; outline-offset:-4px; }
  .card .h { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .card .lab { font-size:10px; font-weight:700; letter-spacing:.04em; }
  .card .actor { font-size:10px; font-weight:500; background:#0b0b0b1a; padding:0 7px; border-radius:99px; }
  .card .x { font-size:12px; } .card .s { font-style:italic; font-size:11px; margin-top:auto; opacity:.8; }
  .card.past::after { content:"✓"; position:absolute; right:8px; bottom:6px; color:#0a7a35; font-weight:800; font-size:14px; }
  .card.future { opacity:.55; }
  .card.cur { outline:3px solid var(--accent); outline-offset:2px; box-shadow:0 0 0 8px rgba(110,122,255,.35), 0 10px 24px rgba(0,0,0,.35); opacity:1; }
  .pain { font-size:11.5px; color:var(--pain-text); background:var(--pain-card); border-radius:3px; padding:2px 2px 6px 0; }
  .pain .pl { color:var(--pain-label); font-weight:700; font-size:10px; letter-spacing:.04em; display:block; margin-bottom:2px; }
  .pain .q { color:var(--quote); margin-top:3px; } .pain .q small { color:var(--muted); display:block; }
  .slash { align-self:center; color:var(--muted); font-size:22px; }
  .noflow { color:var(--muted); border:1px dashed var(--line); border-radius:8px; padding:14px; max-width:640px; margin-top:12px; }
  .quiet { color:var(--muted); font-size:12px; }
  footer { grid-area:dock; border-top:1px solid var(--line); background:var(--panel); padding:10px 14px; display:grid; gap:6px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button, select { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); } button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.on { background:var(--accent-bg); border-color:var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, .jr:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  a { color:var(--accent); }
  .steps { display:flex; gap:4px; flex-wrap:wrap; } .steps button { padding:2px 8px; min-width:28px; } .steps button.cur { background:var(--accent); color:#fff; border-color:var(--accent); } .steps button.done { border-color:var(--ok); }
  #warn { color:var(--warn); font-size:12px; }
  @media (max-width:700px) {
    body { display:block; height:auto; } aside { border-right:0; border-bottom:1px solid var(--line); max-height:240px; } main { overflow:visible; }
    footer { position:sticky; bottom:0; } .track { flex-direction:column; overflow:visible; } .col { padding-right:0; } .cards { flex-direction:column; gap:14px; } .unit { width:100%; } .unit::after { display:none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Journeys remote</h1><span class="pill off" id="conn">Not connected</span>
  <div id="state">No studio window found. Open the studio in another window of this browser.</div>
  <label class="quiet">Studio tab <select id="tabs" aria-label="Studio tab to drive"></select></label>
  <button id="identify" title="Show a banner in the studio tab this remote drives">Find it</button>
  <button id="openOptions" title="Open the Design options remote in its own window">Design options remote ↗</button>
</header>
<aside id="list" aria-label="Journeys"></aside>
<main id="main"></main>
<footer>
  <div class="row"><strong id="stepTitle"></strong><span class="quiet" id="stepMeta"></span></div>
  <div class="quiet" id="expect"></div>
  <div id="warn" role="status"></div>
  <div class="row">
    <button id="ps" title="Previous step (← or k)">← Previous</button>
    <button id="go" class="primary" title="Go to this step again">Go to step</button>
    <button id="ns" title="Next step (→ or j)">Next →</button>
    <label><input type="checkbox" id="done"> Done</label>
    <a id="story" target="_blank" rel="noreferrer" hidden>Storybook</a>
    <span class="steps" id="steps"></span>
    <button id="pj">◀ Journey</button><button id="nj">Journey ▶</button><button id="reset" title="Clear the done marks of this journey">Reset checks</button>
  </div>
</footer>
<script type="module">
import {connect, statusLine} from '/static/remote-core.js'
const CHECKS_KEY = 'variants-2-0-studio:journey-checks'
const POS_KEY = 'variants-2-0-studio:remote-position'
// The studio passes its Storybook base (SANITY_STUDIO_STORYBOOK_BASE or the branch alias) when it opens the remote.
const STORYBOOK = new URLSearchParams(location.search).get('storybook') || 'https://sanity-studio-storybook-git-explorations-variants-2-0.sanity.dev'
const FIGMA = 'https://www.figma.com/design/QCVhwHlQp0QfERBamuj2ey/Studio-Flows'
const $ = (id) => document.getElementById(id)
const load = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null)
const [journeys, flowData] = await Promise.all([load('/static/journeys.json'), load('/static/studio-flows.json')])
const style = flowData?.style ?? {}
{ // the exemplar's fills, from the data (falls back to the CSS defaults)
  const c = style.cards ?? {}, root = document.documentElement.style
  if (c.trigger?.fill) root.setProperty('--c-trigger', c.trigger.fill)
  if (c.step?.fill) root.setProperty('--c-step', c.step.fill)
  if (c.success?.fill) root.setProperty('--c-success', c.success.fill)
  if (c.failure?.fill) root.setProperty('--c-failure', c.failure.fill)
  if (c.step?.text) root.setProperty('--c-text', c.step.text)
}
const actorLabel = (id) => (flowData?.actors ?? []).find((a) => a.id === id)?.label ?? id
const flowById = new Map(), taskById = new Map()
for (const t of flowData?.tasks ?? []) { taskById.set(t.id, t); for (const f of t.flows ?? []) flowById.set(f.id, {flow: f, task: t}) }
const core = connect(() => { renderStatus(); followStudio() })
let pos = {journey: journeys[0].id, step: 0}
try { pos = {...pos, ...JSON.parse(localStorage.getItem(POS_KEY) || '{}')} } catch {}
const checks = () => { try { return JSON.parse(localStorage.getItem(CHECKS_KEY) || '{}') } catch { return {} } }
const journey = () => journeys.find((j) => j.id === pos.journey) ?? journeys[0]
const flowOf = (j) => (j.flow ? flowById.get(j.flow) : undefined)
const stepPreset = (j, s) => s.preset ?? j.id
const pathOf = (s) => (s || '').split('?')[0]
let lastKey = ''

function rich(text, into) {
  const clean = String(text ?? '').replaceAll('\\*', '\u0000')
  for (const part of clean.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/)) {
    if (!part) continue
    if (part.startsWith('**')) { const b = document.createElement('b'); b.textContent = part.slice(2, -2).replaceAll('\u0000', '*'); into.append(b) }
    else if (part.startsWith('*')) { const i = document.createElement('i'); i.textContent = part.slice(1, -1).replaceAll('\u0000', '*'); into.append(i) }
    else into.append(part.replaceAll('\u0000', '*'))
  }
  return into
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
const scopeChip = (f) => { const c = el('span', 'scope', f.scope ?? ''); c.style.background = f.scopeColor ?? style.scopeChips?.[f.scope]?.fill ?? '#777'; c.hidden = !f.scope; return c }
const statusDot = (f) => { const d = el('span', 'dot' + (f ? '' : ' none')); if (f?.statusColor) d.style.background = f.statusColor; return d }

function renderTabs() {
  const sel = $('tabs'), current = core.target()?.tab
  const sig = core.tabs().map((t) => t.tab + t.path).join('|') + current
  if (sel.dataset.sig === sig) return
  sel.dataset.sig = sig
  sel.replaceChildren(...core.tabs().map((t, i) => { const o = el('option', null, `tab ${i + 1} · ${t.path.split('?')[0]}${t.visible ? '' : ' · hidden'}`); o.value = t.tab; return o }))
  if (current) sel.value = current
}
function renderStatus() {
  renderTabs()
  const s = core.target()
  const on = !!s
  $('conn').textContent = on ? 'Connected' : 'Not connected'
  $('conn').className = 'pill ' + (on ? 'on' : 'off')
  $('state').textContent = statusLine(core)
  Object.assign($('state').dataset, {preset: s?.preset ?? '', stage: s?.stage ?? '', path: s?.path ?? '', tab: s?.tab ?? '', tabs: String(core.tabCount())})
}
// When the studio moves on its own to a route and preset that match a walk step of this journey, follow it.
function followStudio() {
  const s = core.target()
  if (!s) return
  const key = `${s.preset}|${pathOf(s.path)}`
  if (key === lastKey) return
  lastKey = key
  const j = journey()
  const matches = j.steps.map((st, i) => [st, i]).filter(([st]) => pathOf(st.route) === pathOf(s.path) && stepPreset(j, st) === s.preset).map(([, i]) => i)
  if (matches.length && !matches.includes(pos.step)) { pos.step = matches.find((i) => i > pos.step) ?? matches[0]; renderAll(false) }
}

async function go(index, silent) {
  const j = journey()
  if (!j.steps.length) return
  pos.step = Math.max(0, Math.min(j.steps.length - 1, index))
  const step = j.steps[pos.step]
  lastKey = `${stepPreset(j, step)}|${pathOf(step.route)}`
  renderAll(true)
  if (silent) return
  $('warn').textContent = ''
  const answer = await core.send({type: 'go', preset: stepPreset(j, step), route: step.route})
  if (!answer) $('warn').textContent = 'No studio tab answered. Is a studio window open in this browser?'
  else if (answer.reached === false) $('warn').textContent = `The studio tab stayed at ${answer.path}; the step wants ${step.route}.`
}
function pickJourney(id) { pos = {journey: id, step: 0}; renderAll(true) }
function changeJourney(delta) { const i = Math.max(0, Math.min(journeys.length - 1, journeys.findIndex((j) => j.id === pos.journey) + delta)); pickJourney(journeys[i].id) }
function setDone(index, on) {
  const c = checks(), key = `${pos.journey}:${index}`
  if (on) c[key] = true; else delete c[key]
  try { localStorage.setItem(CHECKS_KEY, JSON.stringify(c)) } catch {}
  renderAll(false)
}

function renderList() {
  const list = $('list'), c = checks()
  list.replaceChildren()
  for (const taskId of [...new Set(journeys.map((j) => j.task))].sort()) {
    const task = taskById.get(taskId)
    const head = el('div', 'task'); head.append(el('h2', null, task ? `${taskId} · ${task.title}` : taskId))
    if (task?.intro) head.append(el('p', null, task.intro))
    if (task?.desiredExperience) { const d = el('details'); d.append(el('summary', null, 'Desired experience'), el('div', null, task.desiredExperience)); head.append(d) }
    list.append(head)
    for (const j of journeys.filter((x) => x.task === taskId)) {
      const found = flowOf(j)
      const b = el('button', 'jr' + (j.id === pos.journey ? ' cur' : '')); b.dataset.journey = j.id
      b.append(statusDot(found?.flow), el('span', 'tt', found ? found.flow.title : j.title))
      const meta = el('div', 'meta')
      meta.append(el('span', null, j.id.toUpperCase()))
      for (const a of found?.flow.actors ?? []) meta.append(el('span', 'chip', actorLabel(a)))
      if (found) meta.append(scopeChip(found.flow))
      meta.append(el('span', null, `${j.steps.length} steps · ${j.steps.filter((_, i) => c[`${j.id}:${i}`]).length} done`))
      b.append(meta)
      b.addEventListener('click', () => pickJourney(j.id))
      list.append(b)
    }
  }
}

function renderFlow(highlight) {
  const main = $('main'), j = journey(), found = flowOf(j), step = j.steps[pos.step]
  main.replaceChildren()
  if (!found) {
    main.append(el('div', 'noflow', j.flow ? `${j.title}: flow ${j.flow} is not on the Studio Flows page. The walk steps below still run.` : `${j.title}: no designer flow matches this journey. The walk steps below still run.`))
    return
  }
  const {flow, task} = found
  const fs = step?.flowStep ?? null
  const t = el('div'); const tl = el('h2', 'tl', task.titleRaw ?? `TASK ${task.id.slice(1)} · ${task.title}`)
  if (task.review?.raw) tl.append(el('span', 'tag', task.review.raw.replace(/\s+/g, ' ').trim()))
  t.append(tl, el('p', 'tintro', task.intro ?? '')); main.append(t)
  if (task.desiredExperience || flow.desiredExperience) { const de = el('div', 'de'); de.append(el('div', 'cap', 'Desired experience'), rich(flow.desiredExperience ?? task.desiredExperience, el('div', 'x'))); main.append(de) }
  const head = el('div', 'headline'); head.append(statusDot(flow), el('h3', null, `${flow.id} · ${flow.title}`), scopeChip(flow))
  for (const a of flow.actors ?? []) head.append(el('span', 'chip', actorLabel(a)))
  main.append(head)
  const note = el('div', 'note'); note.append(`from Studio Flows, extracted ${flowData.extracted ?? '2026-10-20'} · `)
  const a = el('a', null, `Figma ${flow.node}`); a.href = `${FIGMA}?node-id=${String(flow.node).replace(':', '-')}`; a.target = '_blank'; a.rel = 'noreferrer'; note.append(a)
  main.append(note)
  const track = el('div', 'track'); track.dataset.testid = 'flow-track'
  const mark = (card, kind, n) => {
    card.dataset.kind = kind; if (n != null) card.dataset.n = String(n)
    if (fs != null && (kind === 'step' ? fs === n : fs === kind)) card.classList.add('cur')
    else if (fs != null) {
      if (kind === 'step') { if (typeof fs === 'number' ? n < fs : fs === 'success' || fs === 'failure') card.classList.add('past'); else card.classList.add('future') }
      else if (kind === 'trigger' && fs !== 'trigger') card.classList.add('past')
    }
  }
  const pains = (at) => (flow.painPoints ?? []).filter((p) => String(p.at) === String(at)).map((p) => {
    const d = el('div', 'pain'); d.append(el('span', 'pl', '⚠ PAIN POINT'), rich(p.text, el('span')))
    if (p.quote?.quote) { const q = el('div', 'q'); q.append(rich(p.quote.quote, el('span'))); if (p.quote.attribution) q.append(el('small', null, p.quote.attribution)); d.append(q) }
    return d
  })
  const unit = (card, at) => { const u = el('div', 'unit'); u.append(card, ...pains(at)); return u }
  const trig = el('div', 'card trigger'); const th = el('div', 'h'); th.append(el('span', 'lab', 'TRIGGER')); const tm = flow.triggerMeta?.actor; if (tm) th.append(el('span', 'actor', actorLabel(tm)))
  trig.append(th, rich(flow.trigger, el('div', 'x'))); mark(trig, 'trigger')
  const first = el('div', 'col'); first.append(el('div', 'phase')); const fc = el('div', 'cards'); fc.append(unit(trig, 'trigger')); first.append(fc); track.append(first)
  const stepOf = new Map((flow.steps ?? []).map((s) => [s.n, s]))
  const phases = flow.phases?.length ? flow.phases : [{title: '', description: '', stepNumbers: (flow.steps ?? []).map((s) => s.n)}]
  for (const ph of phases) {
    const col = el('div', 'col'), phase = el('div', 'phase'); phase.append(el('b', null, ph.title), el('span', null, ph.description ?? '')); col.append(phase)
    const cards = el('div', 'cards')
    for (const n of ph.stepNumbers ?? []) {
      const s = stepOf.get(n); if (!s) continue
      const c = el('div', 'card' + (s.idea ? ' idea' : '')); const h = el('div', 'h'); h.append(el('span', 'lab', s.label ?? `STEP ${s.n}` + (s.idea ? ' · IDEA' : '')))
      if (s.actor) h.append(el('span', 'actor', actorLabel(s.actor)))
      c.append(h, rich(s.text, el('div', 'x'))); if (s.surface) c.append(el('div', 's', s.surface))
      mark(c, 'step', s.n); cards.append(unit(c, s.n))
    }
    col.append(cards); track.append(col)
  }
  const end = el('div', 'col'); end.append(el('div', 'phase')); const ec = el('div', 'cards')
  const ok = el('div', 'card success'); ok.append(el('div', 'h', 'SUCCESS'), rich(flow.success, el('div', 'x'))); ok.firstChild.className = 'lab'; mark(ok, 'success')
  const bad = el('div', 'card failure'); bad.append(el('div', 'h', 'FAILURE'), rich(flow.failure, el('div', 'x'))); bad.firstChild.className = 'lab'; mark(bad, 'failure')
  const u1 = el('div', 'unit'); u1.append(ok); const u2 = el('div', 'unit'); u2.append(bad)
  ec.append(u1, el('span', 'slash', '/'), u2); end.append(ec); track.append(end)
  main.append(track)
  if (step && fs == null) main.append(el('div', 'quiet', 'This walk step does not play a designer step.'))
  if (highlight) requestAnimationFrame(() => track.querySelector('.card.cur')?.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'}))
}
// The story link carries the same theme and shape as the studio (the shape follows the Design options window).
function setStoryHref() {
  const j = journey(), step = j.steps[pos.step], a = $('story')
  a.hidden = !step?.story
  if (step?.story) a.href = `${STORYBOOK}/?path=/story/${step.story}&globals=theme:${matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'};shape:${core.target()?.options?.shape ?? 'round'};rowLayout:${core.target()?.options?.rowLayout ?? 'actionsRight'};pillWhenOpen:${core.target()?.options?.pillWhenOpen ?? 'versionCount'};toastAction:${core.target()?.options?.toastAction ?? 'button'};toastStyle:${core.target()?.options?.toastStyle ?? 'stock'};listWhenPerspective:${core.target()?.options?.listWhenPerspective ?? 'grouped'};priorityView:${core.target()?.options?.priorityView ?? 'hide'}`
}
function renderDock() {
  const j = journey(), c = checks(), step = j.steps[pos.step]
  $('stepTitle').textContent = step ? `${pos.step + 1}/${j.steps.length}  ${step.title}` : 'This journey has no steps yet'
  $('stepMeta').textContent = step ? [step.component && `${step.component}${step.option ? ' ' + step.option : ''}`, `preset ${stepPreset(j, step)}`, step.route].filter(Boolean).join(' · ') : ''
  $('expect').textContent = step?.expect ? `Expect: ${step.expect}` : ''
  $('done').checked = !!c[`${j.id}:${pos.step}`]; $('done').disabled = !step
  setStoryHref()
  const steps = $('steps'); steps.replaceChildren()
  j.steps.forEach((_, i) => { const b = el('button', (i === pos.step ? 'cur ' : '') + (c[`${j.id}:${i}`] ? 'done' : ''), String(i + 1)); b.dataset.step = String(i); b.addEventListener('click', () => go(i)); steps.append(b) })
}
function renderAll(highlight) {
  try { localStorage.setItem(POS_KEY, JSON.stringify(pos)) } catch {}
  renderList(); renderFlow(highlight); renderDock()
  document.body.dataset.journey = pos.journey; document.body.dataset.step = String(pos.step)
  document.body.dataset.flowStep = String(journey().steps[pos.step]?.flowStep ?? '')
}
$('ps').addEventListener('click', () => go(pos.step - 1))
$('ns').addEventListener('click', () => go(pos.step + 1))
$('tabs').addEventListener('change', (e) => core.choose(e.target.value))
$('identify').addEventListener('click', () => core.send({type: 'identify'}))
$('go').addEventListener('click', () => go(pos.step))
$('pj').addEventListener('click', () => changeJourney(-1))
$('nj').addEventListener('click', () => changeJourney(1))
$('done').addEventListener('change', (e) => setDone(pos.step, e.target.checked))
$('reset').addEventListener('click', () => { const c = checks(), j = journey(); j.steps.forEach((_, i) => delete c[`${j.id}:${i}`]); try { localStorage.setItem(CHECKS_KEY, JSON.stringify(c)) } catch {}; renderAll(false) })
$('openOptions').addEventListener('click', () => window.open('/static/options-remote.html', 'variants-2-0-options-remote', 'popup,width=520,height=820'))
window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLElement && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return
  if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); go(pos.step + 1) }
  else if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); go(pos.step - 1) }
})
window.addEventListener('storage', (e) => { if (e.key === CHECKS_KEY) renderAll(false) })
renderAll(true)
renderStatus()
</script>
</body>
</html>
