packages:
  - dev/*
  - perf/*
  - engine-confidence
  - examples/*
  - scripts
  - e2e
  - packages/@repo/*
  - packages/@sanity/*
  - packages/groq
  - packages/sanity
  - packages/sanity/fixtures/examples/*

allowBuilds:
  # Panda CSS dependency; its postinstall is only a fallback downloader, the native binary arrives
  # through platform-specific optionalDependencies
  '@parcel/watcher': false
  '@playwright/browser-chromium': false
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  lefthook: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@optique/core': ^1.1.1
  '@optique/run': ^1.1.1
  '@pandacss/dev': ^2.4.0
  '@pandacss/vite': ^2.4.0
  '@playwright/test': 1.64.0
  '@sanity/client': ^8.11.0
  '@sanity/migrate': ^8.0.5
  '@sanity/pandacss-tsdown-plugin': ^0.3.1
  '@sanity/schema-descriptor-utils': 1.3.3
  '@sanity/telemetry': ^1.1.0
  '@sanity/tsdown-config': ^0.31.2
  '@sanity/ui': ^4.4.9
  '@types/node': ^24.13.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/react-is': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/browser-playwright': ^5.0.4
  cobe: ^2.0.1
  dequal: ^2.0.3
  get-it: ^9.6.2
  jsdom: ^29.1.1
  oxc-parser: ^0.155.0
  oxc-transform-react: ^0.155.0
  playwright: 1.64.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-focus-lock: ^2.13.7
  react-is: ^19.3.1
  react-rx: ^7.1.0
  rimraf: ^6.1.3
  storybook: ^10.6.2
  styled-components: ^6.6.0
  # Exact version on purpose (like @sanity/workbench): bumps are explicit so published
  # packages ship the version we validated instead of whatever the alpha dist-tag points to
  ui5: npm:@sanity/ui@5.0.0-alpha.17
  tsdown: ^0.23.2
  # Pins its `tsdown` peer to the exact release it ships with, so bump it together with `tsdown`
  '@tsdown/css': ^0.23.2
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.0.4
  vitest-browser-react: ^2.3.0

autoDedupe: true
catalogMode: prefer
dedupePeers: true
linkWorkspacePackages: deep

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@boundaries/elements'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@oclif/core'
  - '@vitest/*'
  - '@vite/*'
  - '@vitejs/plugin-react'
  - '@portabletext/*'
  - '@sanity/*'
  - '@sanity-labs/*'
  - '@yuku-codegen/*'
  - '@sentry/conventions@0.27.0'
  # yuku 0.19 moved the native bindings from @yuku-codegen/* and @yuku-parser/* to this scope
  - '@yuku-core/*'
  - '@yuku-parser/*'
  - '@yuku-toolchain/types'
  - '@types/*'
  - '@typescript/*'
  - '@vercel/stega'
  - '@yuku-toolchain/*'
  - '@codemirror/search'
  - '@codemirror/state'
  - '@codemirror/view'
  - 'csstype'
  - 'eslint-plugin-boundaries'
  - 'eventsource-parser@4.1.2'
  - 'get-it'
  - 'groq-js'
  # Fresh patch; exclude so 26.4.4 can install before the age gate
  - 'i18next@26.4.4'
  # lightningcss and its per-platform native bindings (lightningcss-linux-x64-gnu etc.) release
  # in lockstep; @sanity/tsdown-config tracks its latest so builds pick up new bindings together
  - 'lightningcss'
  - 'lightningcss-*'
  # motion, framer-motion and motion-dom release in lockstep, often several times a week, so new
  # versions are routinely younger than minimumReleaseAge
  - 'framer-motion'
  - 'motion'
  - 'motion-dom'
  # motion-utils does not ship a release for every motion version; 14.1.1 is the one the current
  # motion releases depend on, and it is still younger than the age gate
  - 'motion-utils@14.1.1'
  # oxc-transform-react and its per-platform native bindings (@oxc-transform-react/binding-*)
  # release in lockstep with the oxc toolchain; @vitejs/plugin-react and
  # @sanity/cli/@sanity/tsdown-config pin fresh versions as peers for the React Compiler oxc transform
  - 'oxc-transform-react'
  - '@oxc-transform-react/*'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - 'react'
  - 'react-dom'
  - 'react-hook-form'
  # Fresh major; exclude so 8.0.0 can install before the age gate
  - 'react-devtools-core@8.0.0'
  - 'react-is'
  - 'react-rx'
  # Fresh patch; exclude so 0.28.0 can install before the age gate
  - 'scheduler@0.28.0'
  # tsdown and its rolldown/rolldown-plugin-dts/yuku toolchain release frequently and in
  # lockstep, so new releases are often younger than minimumReleaseAge
  - 'rolldown'
  - '@rolldown/*'
  - 'rolldown-plugin-dts'
  - 'sanity-plugin-internationalized-array'
  - 'sanity-plugin-media'
  - 'sanity-plugin-asset-source-unsplash'
  - 'sanity-plugin-utils'
  # Fresh patch; exclude so 6.6.0 can install before the 3-day age gate
  - 'styled-components@6.6.0'
  - 'tsx'
  - 'tsdown'
  # Ships with tsdown and pins that release as its peer, so it is younger than the age gate on the same bumps
  - '@tsdown/css'
  # Fresh patch; exclude so 2.0.4 can install before the age gate
  - 'use-effect-event@2.0.4'
  # Fresh minor; exclude so 1.7.0 can install before the age gate
  - 'use-sync-external-store@1.7.0'
  # verkit is part of the tsdown toolchain (tsdown dependency since 0.22.12)
  - 'verkit'
  - 'vitest'
  - 'vite'
  # Fresh major; exclude so install can resolve before the age gate would allow it
  - 'web-vitals'
  # covers yuku-ast/yuku-codegen/yuku-parser, which ship together with rolldown-plugin-dts
  - 'yuku-*'
  # Fresh patch; exclude so 4.6.7 can install before the age gate
  - 'zod@4.6.7'

overrides:
  vitest: 'catalog:'
  # tsdown 0.23.2 depends on rolldown-plugin-dts ^0.29.0-beta.2. That beta's tsgo
  # generator requires typescript@7.1.0-beta's declaration emit API. 0.28.8 still
  # drives the TypeScript 7.0 tsgo CLI (dts.generator: 'tsgo').
  rolldown-plugin-dts: 0.28.8

preferWorkspacePackages: true

trustPolicy: no-downgrade

trustPolicyExcludePrune: true
trustPolicyExclude:
  - '@sanity/cli'
  # @sanity/vision's result diff (@pierre/diffs) depends on it. 1.0.0 was published with
  # provenance; 1.1.0 and 2.0.0 without it, by a listed maintainer who also publishes
  # @pierre/diffs (which has never shipped provenance)
  - '@pierre/theme@2.0.0'
  # Published without the provenance of 4.0.2; @css-modules-kit/codegen depends on ^4.0.3
  - chokidar@4.0.3
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - undici@5.29.0
patchedDependencies:
  # The runner joins describe and test names with ' ' but Vitest 5 filters on ' > ', so tests
  # inside a describe never run against a mutant and it reports as survived. Drop once fixed upstream
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
