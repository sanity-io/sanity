packages:
  - dev/*
  - perf/*
  - engine-confidence
  - examples/*
  - examples/studios/*
  - scripts
  - e2e
  - packages/@repo/*
  - packages/@sanity/*
  - packages/groq
  - packages/sanity

allowBuilds:
  # Panda CSS dependency; its postinstall is only a fallback downloader, the native binary arrives
  # through platform-specific optionalDependencies
  '@parcel/watcher': false
  '@playwright/browser-chromium': false
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  lefthook: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@optique/core': ^1.4.0
  '@optique/run': ^1.4.0
  '@pandacss/dev': ^2.6.0
  '@pandacss/vite': ^2.6.0
  '@playwright/test': 1.65.1
  '@sanity/client': ^8.17.0
  '@sanity/migrate': ^8.0.5
  '@sanity/pandacss-tsdown-plugin': ^0.3.4
  '@sanity/schema-descriptor-utils': 1.4.0
  '@sanity/sdk': ^3.17.0
  '@sanity/sdk-react': ^3.17.0
  '@sanity/telemetry': ^1.1.0
  '@sanity/tsdown-config': ^0.33.0
  '@sanity/ui': ^4.4.14
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/react-is': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  '@vitest/browser-playwright': ^5.1.1
  cobe: ^2.0.1
  dequal: ^2.0.3
  esbuild: ^0.28.2
  fast-check: ^4.11.0
  get-it: ^9.7.0
  jsdom: ^31.0.1
  oxc-parser: ^0.160.0
  oxc-transform-react: ^0.158.0
  playwright: 1.65.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-focus-lock: ^2.13.7
  react-is: ^19.3.1
  react-rx: ^7.1.0
  rimraf: ^6.1.4
  storybook: ^10.6.8
  styled-components: ^6.7.0
  # Exact version on purpose (like @sanity/workbench): bumps are explicit so published
  # packages ship the version we validated instead of whatever the alpha dist-tag points to
  ui5: npm:@sanity/ui@5.0.0-alpha.28
  tsdown: ^0.23.7
  # Pins its `tsdown` peer to the exact release it ships with, so bump it together with `tsdown`
  '@tsdown/css': ^0.23.7
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.1
  vitest-browser-react: ^2.3.0
  zod: ^4.6.7

autoDedupe: true
catalogMode: prefer
dedupePeers: true
linkWorkspacePackages: deep

minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@boundaries/elements'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@oclif/core'
  # Locked before the age gate went from 1 to 3 days; these excludes can go once they are 3 days old
  - '@oxc-parser/*'
  - '@oxc-project/types@0.160.0'
  - 'oxc-parser@0.160.0'
  - '@tanstack/react-virtual@3.14.28'
  - '@tanstack/virtual-core@3.19.13'
  - 'eslint-plugin-testing-library@7.16.3'
  - 'knip@6.48.0'
  - 'styled-components@6.7.0'
  - 'electron-to-chromium@1.5.493'
  - '@pnpm/exe*'
  - '@vitest/*'
  - '@vite/*'
  - '@vitejs/plugin-react'
  - '@portabletext/*'
  # Fresh Storybook and Chromatic patches; exclude so these updates can install before the age gate
  - '@storybook/addon-vitest@10.6.9'
  - '@storybook/builder-vite@10.6.9'
  - '@storybook/react-dom-shim@10.6.9'
  - '@storybook/react-vite@10.6.9'
  - '@storybook/react@10.6.9'
  - 'chromatic@18.15.3'
  - 'storybook@10.6.9'
  # Fresh patch; exclude so 1.7.1 can install before the age gate
  - '@pierre/diffs@1.7.1'
  - '@sanity/*'
  - '@sanity-labs/*'
  - '@yuku-codegen/*'
  # yuku 0.19 moved the native bindings from @yuku-codegen/* and @yuku-parser/* to this scope
  - '@yuku-core/*'
  - '@yuku-parser/*'
  - '@types/*'
  - '@typescript/*'
  - '@vercel/stega'
  - '@yuku-toolchain/*'
  - '@codemirror/search'
  - '@codemirror/state'
  - '@codemirror/view'
  - 'csstype'
  - 'eslint-plugin-boundaries'
  - 'get-it'
  - 'groq-js'
  # lightningcss and its per-platform native bindings (lightningcss-linux-x64-gnu etc.) release
  # in lockstep; @sanity/tsdown-config tracks its latest so builds pick up new bindings together
  - 'lightningcss'
  - 'lightningcss-*'
  - 'mendoza'
  # motion, framer-motion and motion-dom release in lockstep, often several times a week, so new
  # versions are routinely younger than minimumReleaseAge
  - 'framer-motion'
  - 'motion'
  - 'motion-dom'
  # oxc-transform-react and its per-platform native bindings (@oxc-transform-react/binding-*)
  # release in lockstep with the oxc toolchain; @vitejs/plugin-react and
  # @sanity/cli/@sanity/tsdown-config pin fresh versions as peers for the React Compiler oxc transform
  - 'oxc-transform-react'
  - '@oxc-transform-react/*'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - 'react'
  - 'react-dom'
  - 'react-hook-form'
  # Fresh major; exclude so 8.0.0 can install before the age gate
  - 'react-devtools-core@8.0.0'
  - 'react-is'
  - 'react-rx'
  # Fresh patch; exclude so 0.28.0 can install before the age gate
  - 'scheduler@0.28.0'
  # tsdown and its rolldown/rolldown-plugin-dts/yuku toolchain release frequently and in
  # lockstep, so new releases are often younger than minimumReleaseAge
  - 'rolldown'
  - '@rolldown/*'
  - 'rolldown-plugin-dts'
  - 'sanity-plugin-internationalized-array'
  - 'sanity-plugin-media'
  - 'sanity-plugin-asset-source-unsplash'
  - 'sanity-plugin-utils'
  - 'tsx'
  - 'tsdown'
  # Ships with tsdown and pins that release as its peer, so it is younger than the age gate on the same bumps
  - '@tsdown/css'
  # Fresh minor; exclude so 1.7.0 can install before the age gate
  - 'use-sync-external-store@1.7.0'
  # verkit is part of the tsdown toolchain (tsdown dependency since 0.22.12)
  - 'verkit'
  - 'vitest'
  - 'vite'
  # Fresh major; exclude so install can resolve before the age gate would allow it
  - 'web-vitals'
  # covers yuku-ast/yuku-codegen/yuku-parser, which ship together with rolldown-plugin-dts
  - 'yuku-*'
  # Fresh patch; exclude so 4.6.7 can install before the age gate
  - 'zod@4.6.7'

overrides:
  # Keep styled-components CSSObject compatible with @sanity/ui's responsive styles: both pin
  # csstype 3.2.3 while @types/react resolves 3.2.4, so align them on the one csstype in the tree.
  '@sanity/ui@4.4.14>csstype': 3.2.4
  'styled-components@6.7.0>csstype': 3.2.4
  vitest: 'catalog:'

preferWorkspacePackages: true

trustPolicy: no-downgrade

trustPolicyExcludePrune: true
trustPolicyExclude:
  - '@sanity/cli'
  # @sanity/vision's result diff (@pierre/diffs) depends on it. 1.0.0 was published with
  # provenance; later releases without it, by a listed maintainer who also publishes
  # @pierre/diffs (which has never shipped provenance)
  - '@pierre/theme@2.1.0'
  # 2.2.2 was published with weaker trust evidence than earlier releases
  - lefthook@2.2.2
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - undici@5.29.0
patchedDependencies:
  # The patches below rewrite imports of names that v7 no longer exports from the sanity root to the
  # private internals entry. Drop each one once a release of the plugin that supports this sanity
  # major ships.
  # The @sanity/assist, @sanity/document-internationalization and sanity-plugin-utils patches also
  # rewrite names that moved off sanity/structure and sanity/router to the /structure and /router
  # subpaths of that entry. They, and the sanity-plugin-internationalized-array patch, import
  # useDocumentPane from the -1 subpath, which a studio config may load before sign-in.
  '@sanity/assist@6.3.0': patches/@sanity__assist@6.3.0.patch
  # The three @sanity/cli patches read createSchema, createDefaultIcon, SchemaError, resolveConfig and
  # generateStudioManifest from the private internals entry first and fall back to the sanity root,
  # because the CLI resolves them from the root at runtime. Temporary until the upstream sanity-io/cli
  # fix is released.
  '@sanity/cli-build@7.5.1': patches/@sanity__cli-build@7.5.1.patch
  '@sanity/cli-core@3.16.0': patches/@sanity__cli-core@3.16.0.patch
  '@sanity/cli@8.35.0': patches/@sanity__cli@8.35.0.patch
  '@sanity/code-input@7.3.16': patches/@sanity__code-input@7.3.16.patch
  # Also rewrites defineLocaleResourceBundle / useTranslation to sanity/i18n.
  '@sanity/document-internationalization@6.3.1': patches/@sanity__document-internationalization@6.3.1.patch
  '@sanity/google-maps-input@6.1.18': patches/@sanity__google-maps-input@6.1.18.patch
  '@sanity/language-filter@5.0.24': patches/@sanity__language-filter@5.0.24.patch
  '@sanity/themer@0.11.0': patches/@sanity__themer@0.11.0.patch
  sanity-plugin-internationalized-array@5.3.10: patches/sanity-plugin-internationalized-array@5.3.10.patch
  sanity-plugin-media@6.6.5: patches/sanity-plugin-media@6.6.5.patch
  sanity-plugin-utils@2.0.24: patches/sanity-plugin-utils@2.0.24.patch
