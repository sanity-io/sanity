packages:
  - dev/*
  - perf/*
  - examples/*
  - scripts
  - e2e
  - packages/@repo/*
  - packages/@sanity/*
  - packages/groq
  - packages/sanity
  - packages/sanity/fixtures/examples/*

allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  lefthook: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@optique/core': ^1.1.1
  '@optique/run': ^1.1.1
  '@playwright/test': 1.62.1
  '@sanity/client': ^8.4.0
  '@sanity/migrate': ^8.0.2
  '@sanity/telemetry': ^1.1.0
  '@sanity/tsdown-config': ^0.27.1
  '@sanity/ui': ^4.0.7
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/react-is': ^19.2.0
  '@sanity/vanilla-extract-vite-plugin': ^0.2.17
  '@vanilla-extract/css': ^1.21.2
  '@vanilla-extract/dynamic': ^2.1.5
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/browser-playwright': ^4.1.11
  dequal: ^2.0.3
  jsdom: ^29.1.1
  oxc-transform-react: ^0.148.0
  playwright: 1.62.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-is: ^19.2.8
  react-rx: ^6.0.1
  rimraf: ^6.1.3
  storybook: ^10.5.10
  styled-components: ^6.5.3
  # Exact version on purpose (like @sanity/workbench): bumps are explicit so published
  # packages ship the version we validated instead of whatever the alpha dist-tag points to
  ui5: npm:@sanity/ui@5.0.0-alpha.8
  tsdown: ^0.22.14
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
  vitest-browser-react: ^2.2.0

dedupePeers: true
linkWorkspacePackages: deep

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@boundaries/elements'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@oclif/core'
  - '@vitest/*'
  - '@vite/*'
  - '@vitejs/plugin-react'
  - '@portabletext/*'
  - '@sanity/*'
  # @sentry/react and its SDK dependencies publish in lockstep
  - '@sentry/browser-utils@10.73.0'
  - '@sentry/browser@10.73.0'
  - '@sentry/core@10.73.0'
  - '@sentry/feedback@10.73.0'
  - '@sentry/react@10.73.0'
  - '@sentry/replay-canvas@10.73.0'
  - '@sentry/replay@10.73.0'
  - '@yuku-codegen/*'
  - '@yuku-parser/*'
  - '@yuku-toolchain/types'
  - '@types/*'
  - '@typescript/*'
  - '@vanilla-extract/*'
  - '@vercel/stega'
  - '@yuku-toolchain/*'
  - '@codemirror/search'
  - '@codemirror/state'
  - '@codemirror/view'
  - 'csstype'
  - 'eslint-plugin-boundaries'
  - 'get-it'
  - 'groq-js'
  # lightningcss and its per-platform native bindings (lightningcss-linux-x64-gnu etc.) release
  # in lockstep; @sanity/tsdown-config tracks its latest so builds pick up new bindings together
  - 'lightningcss'
  - 'lightningcss-*'
  # Fresh motion patch pulled in by @sanity/ui@4.0.6; exclude so 13.1.1 can
  # install before the 3-day age gate
  - 'framer-motion@13.1.1'
  - 'motion-dom@13.1.1'
  - 'motion@13.1.1'
  # oxc-transform-react and its per-platform native bindings (@oxc-transform-react/binding-*)
  # release in lockstep with the oxc toolchain; @vitejs/plugin-react and
  # @sanity/cli/@sanity/tsdown-config pin fresh versions as peers for the React Compiler oxc transform
  - 'oxc-transform-react'
  - '@oxc-transform-react/*'
  - 'oxfmt'
  - 'oxlint'
  - 'oxlint-tsgolint'
  - 'react'
  - 'react-dom'
  - 'react-hook-form'
  # Fresh patch; exclude so 17.0.13 can install before the age gate
  - 'react-i18next@17.0.13'
  - 'react-is'
  - 'react-rx'
  - 'i18next@26.4.1'
  # tsdown and its rolldown/rolldown-plugin-dts/yuku toolchain release frequently and in
  # lockstep, so new releases are often younger than minimumReleaseAge
  - 'rolldown'
  - '@rolldown/*'
  - 'rolldown-plugin-dts'
  - 'sanity-plugin-internationalized-array'
  - 'sanity-plugin-media'
  - 'sanity-plugin-asset-source-unsplash'
  - 'sanity-plugin-utils'
  # Fresh patch; exclude so 6.5.3 can install before the 3-day age gate
  - 'styled-components@6.5.3'
  - 'tsx'
  - 'tsdown'
  # Fresh patch; exclude so 2.0.4 can install before the age gate
  - 'use-effect-event@2.0.4'
  # verkit is part of the tsdown toolchain (tsdown dependency since 0.22.12)
  - 'verkit'
  - 'vitest'
  - 'vite'
  # Fresh major; exclude so install can resolve before the age gate would allow it
  - 'web-vitals'
  # covers yuku-ast/yuku-codegen/yuku-parser, which ship together with rolldown-plugin-dts
  - 'yuku-*'
  - '@oxc-project/types@0.147.0'

overrides:
  vitest: 'catalog:'
  # vite 8.2.2 allows `rolldown: ~1.2.4` but its bundledDev browser runtime
  # (dist/client/bundledDevClient.mjs) is compiled from rolldown 1.2.4. rolldown 1.2.6
  # (rolldown/rolldown#10772) emits `registerModule(id)` without an exports holder for export-less
  # modules (e.g. vanilla-extract `*.vanilla.css`) and relies on a matching runtime default, so
  # `sanity dev` with `unstable_bundledDev: true` crashes with "Cannot read properties of
  # undefined (reading 'exports')" as soon as a lazy chunk containing one is initialized.
  # Pin vite's rolldown to the last version matching its inlined runtime; other consumers
  # (tsdown, rolldown-plugin-dts) keep 1.2.6. Remove once the catalog has vite >= 8.3.0,
  # which inlines the 1.2.6 runtime and pins `rolldown: ~1.2.6`.
  'vite>rolldown': '1.2.5'

preferWorkspacePackages: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - '@reduxjs/toolkit@2.9.0 || 2.10.1 || 2.11.0'
  - '@sanity/cli'
  - '@sanity/mutate@0.11.0-canary.4'
  - '@sanity/sdk@3.0.0'
  - '@sanity/sdk-react@3.0.0'
  - '@swc/core@1.13.5'
  - chokidar@4.0.3
  # 5.24.0 got accidental trust-downgrade
  # 3.88.1-typegen-experimental.0 is a dependency of @sanity/sdk-react
  - groq@5.24.0 || 3.88.1-typegen-experimental.0
  - sanity-plugin-internationalized-array@4.0.8
  - react-redux@9.2.0
  - reselect@5.1.1
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - undici@5.29.0
  - undici-types@6.21.0
  - vite@6.4.1
